# job-watcher config — the ONE file you edit to scale coverage.
#
# To add a company:  add a line under `companies:` with its provider + slug.
#   provider: greenhouse | ashby | lever | workday | amazon | apple |
#             microsoft | google | eightfold | meta
#   - greenhouse/ashby/lever: just need `slug` (the part after the board URL).
#   - workday: need host, tenant, site (see examples).
#   - amazon/apple/microsoft/google: optional `query:` to bias the search.
#   - eightfold: need host + domain (phase-2, verify with --dry-run first).
# Set `enabled: false` to mute a company without deleting it.

# ── Title filter (mirrors career-ops) ────────────────────────────────
# Keep a role if >=1 positive matches AND 0 negatives match (case-insensitive).
filter:
  positive:
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    - "Machine Learning"
    - "Voice AI"
    - "Conversational"
    - "Speech"
    - "Backend"
    - "Back-End"
    - "Back End"
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    - "Frontend"
    - "Front-End"
    - "Front End"
    - "Software Engineer"
    - "Software Developer"
    - "Software Development"
    - "SWE"
    - "SDE"
    - "Developer"
    - "Web Developer"
    - "Distributed Systems"
    - "Infrastructure Engineer"
    - "Systems Engineer"
    - "API Engineer"
    - "Platform Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Deployed Engineer"
    - "Customer Engineer"
    - "Integration Engineer"
    - "Founding Engineer"
    - "Applied AI"
    - "Developer Advocate"
    - "DevRel"
    - "Automation"
    # -- Japanese engineering keywords (for HRMOS/JP companies posting in Japanese) --
    - "エンジニア"          # engineer (covers backend/frontend/infra/ML engineer)
    - "ソフトウェア"        # software
    - "機械学習"            # machine learning
    - "開発エンジニア"      # development engineer
  negative:
    - ".NET"
    - "iOS"
    - "Android"
    - "PHP"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Mainframe"
    - "COBOL"
    - "Salesforce Admin"
    # -- Seniority: out of scope for an early-career search --
    - "Senior"
    - "Sr."
    - "Staff "          # trailing space → "Staff Engineer" but not "Member of Technical Staff"
    - "Principal"
    - "Lead "           # "Lead Engineer" but not "Leadership"/"Team Lead"
    - "Director"
    - "Head of"
    - "Vice President"
    - "Distinguished"
  # Location: drop US ON-SITE roles (can't relocate without remote). Keep remote
  # (anywhere), India, and non-US on-site (Japan/EU — those sponsor relocation).
  # always_allow (Remote) wins over block; empty location always passes.
  location:
    always_allow:
      - "Remote"
      - "Anywhere"
    block:
      - "United States"
      - "United States of America"
      - "USA"
      - "San Francisco"
      - "New York"
      - "Costa Mesa"
      - "Seattle"
      - "Austin"
      - "Boston"
      - "Los Angeles"
      - "Mountain View"
      - "Palo Alto"
      - "Sunnyvale"
      - "Santa Ana"
      - "Atlanta"
      - "Denver"
      - "Dallas"
      - "Chicago"
      - "San Jose"
      - "Cupertino"
      - "Bellevue"
      - "Redmond"

