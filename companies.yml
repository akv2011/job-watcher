# job-watcher config — the ONE file you edit to scale coverage.
#
# To add a company:  add a line under `companies:` with its provider + slug.
#   provider: greenhouse | ashby | lever | workday | amazon | apple |
#             microsoft | google | eightfold | meta
#   - greenhouse/ashby/lever: just need `slug` (the part after the board URL).
#   - workday: need host, tenant, site (see examples).
#   - amazon/apple/microsoft/google: optional `query:` to bias the search.
#   - eightfold: need host + domain (phase-2, verify with --dry-run first).
# Set `enabled: false` to mute a company without deleting it.

# ── Title filter (mirrors career-ops) ────────────────────────────────
# Keep a role if >=1 positive matches AND 0 negatives match (case-insensitive).
filter:
  positive:
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    - "Machine Learning"
    - "Voice AI"
    - "Conversational"
    - "Speech"
    - "Backend"
    - "Back-End"
    - "Back End"
    - "Full Stack"
    - "Full-Stack"
    - "Fullstack"
    - "Frontend"
    - "Front-End"
    - "Front End"
    - "Software Engineer"
    - "Software Developer"
    - "Software Development"
    - "SWE"
    - "SDE"
    - "Developer"
    - "Web Developer"
    - "Distributed Systems"
    - "Infrastructure Engineer"
    - "Systems Engineer"
    - "API Engineer"
    - "Platform Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Forward Deployed"
    - "Deployed Engineer"
    - "Customer Engineer"
    - "Integration Engineer"
    - "Founding Engineer"
    - "Applied AI"
    - "Developer Advocate"
    - "DevRel"
    - "Automation"
  negative:
    - ".NET"
    - "iOS"
    - "Android"
    - "PHP"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Mainframe"
    - "COBOL"
    - "Salesforce Admin"
  # Location filter is OFF by default (open to remote + India + global).
  # Uncomment + customize to restrict:
  # location:
  #   always_allow: ["India", "Remote"]
  #   allow: ["Remote", "India", "Bengaluru", "United States"]
  #   block: []

